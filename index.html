<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TasbihKu</title>
  <style>
    :root {
      --bg-1: #03121d;
      --bg-2: #0b5d49;
      --card: rgba(9, 18, 28, 0.78);
      --card-border: rgba(255,255,255,0.10);
      --text: #ffffff;
      --soft: #d7f7e7;
      --muted: #a5d9c4;
      --accent: #16c784;
      --accent-2: #0ea56f;
      --progress-empty: rgba(255,255,255,0.10);
      --circle-1: #093425;
      --circle-2: #0b6243;
      --glass: rgba(255,255,255,0.08);
      --danger: #fb7185;
      --shadow: rgba(0,0,0,0.34);
    }

    body.theme-night {
      --bg-1: #050816;
      --bg-2: #191950;
      --card: rgba(10, 16, 33, 0.82);
      --soft: #dbe9ff;
      --muted: #b2c0f5;
      --accent: #6aa9ff;
      --accent-2: #7c68ff;
      --circle-1: #0a1027;
      --circle-2: #1e2468;
      --danger: #f472b6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      transition: background 0.3s ease;
    }

    .app {
      width: 430px;
      max-width: 100%;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 30px;
      padding: 18px;
      box-shadow: 0 30px 70px var(--shadow);
      backdrop-filter: blur(16px);
      position: relative;
      overflow: hidden;
    }

    .app::before {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -75px;
      top: -75px;
      background: color-mix(in srgb, var(--accent) 22%, transparent);
    }

    .topbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo-panel {
      width: fit-content;
      max-width: 220px;
      background: rgba(255,255,255,0.96);
      border-radius: 18px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 58px;
      box-shadow:
        inset 0 0 0 1px rgba(15,23,42,0.06),
        0 12px 24px rgba(0,0,0,0.12);
    }

    .logo-panel img {
      width: 152px;
      max-width: 100%;
      height: auto;
      display: block;
    }

    .theme-btn {
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      background: var(--glass);
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.18s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .theme-btn:active,
    .main-circle:active,
    .minus-circle:active,
    .ghost-btn:active {
      transform: scale(0.96);
    }

    .controls {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 800;
      color: var(--soft);
      margin: 0 0 6px 4px;
    }

    .field select,
    .field input {
      width: 100%;
      background: var(--glass);
      color: white;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 15px;
      padding: 13px 12px;
      outline: none;
      font-size: 15px;
    }

    .field select option {
      color: #111827;
    }

    .field input::placeholder {
      color: rgba(255,255,255,0.45);
    }

    .circle-wrap {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 18px 0 8px;
      min-height: 275px;
    }

    .circle-stage {
      position: relative;
      width: 255px;
      height: 255px;
      display: grid;
      place-items: center;
    }

    .outer-progress {
      position: relative;
      z-index: 2;
      width: 232px;
      height: 232px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--accent) 0deg, var(--progress-empty) 0deg);
      box-shadow: inset 0 0 38px rgba(0,0,0,0.26), 0 24px 50px rgba(0,0,0,0.30);
      transition: background 0.24s ease, transform 0.2s ease;
    }

    .outer-progress.hit { animation: progressHit 0.25s ease; }

    @keyframes progressHit {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .main-circle {
      width: 192px;
      height: 192px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.11);
      background: linear-gradient(145deg, var(--circle-1), var(--circle-2));
      box-shadow: inset 0 0 24px rgba(255,255,255,0.05);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-align: center;
      padding: 18px;
      position: relative;
      overflow: hidden;
    }

    .main-circle::before {
      content: "+";
      position: absolute;
      top: 22px;
      right: 26px;
      font-size: 28px;
      font-weight: 900;
      color: rgba(255,255,255,0.28);
    }

    .main-circle::after {
      content: "Tap";
      position: absolute;
      bottom: 18px;
      font-size: 12px;
      color: rgba(255,255,255,0.34);
      letter-spacing: 0.6px;
      font-weight: 700;
    }

    .count {
      font-size: clamp(54px, 15vw, 66px);
      line-height: 0.95;
      font-weight: 950;
      letter-spacing: -2px;
      text-shadow: 0 10px 22px rgba(0,0,0,0.30);
    }

    .target-text {
      margin-top: 8px;
      color: var(--soft);
      font-size: 14px;
      font-weight: 700;
    }

    .zikir-text {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 900;
    }

    .minus-circle {
      position: absolute;
      z-index: 5;
      right: 18px;
      bottom: 18px;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.10);
      color: white;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(0,0,0,0.20);
      backdrop-filter: blur(8px);
    }

    .hint {
      position: relative;
      z-index: 2;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin-top: -4px;
      margin-bottom: 12px;
    }

    .actions {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .ghost-btn {
      min-height: 46px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      color: white;
      font-weight: 800;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .ghost-btn.danger {
      background: rgba(251, 113, 133, 0.15);
      border-color: rgba(251, 113, 133, 0.24);
    }

    .status {
      position: relative;
      z-index: 2;
      margin-top: 12px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 14px;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.45;
      min-height: 52px;
    }

    .history {
      position: relative;
      z-index: 2;
      margin-top: 14px;
    }

    .history h2 {
      font-size: 16px;
      margin-bottom: 9px;
    }

    .history-list {
      display: grid;
      gap: 8px;
      max-height: 136px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 10px 12px;
      color: var(--soft);
      font-size: 13px;
    }

    @media (max-width: 420px) {
      body { align-items: flex-start; padding: 12px; }
      .app { padding: 16px; border-radius: 26px; }
      .controls { grid-template-columns: 1fr; }
      .logo-panel {
        max-width: 190px;
        padding: 7px 10px;
        min-height: 52px;
      }
      .logo-panel img { width: 132px; }
      .circle-stage { width: 242px; height: 242px; }
      .outer-progress { width: 218px; height: 218px; }
      .main-circle { width: 180px; height: 180px; }
      .minus-circle { width: 64px; height: 64px; right: 10px; bottom: 14px; }
      .history-item { flex-direction: column; gap: 3px; }
    }
  </style>
</head>

      </div>
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Tukar theme">🌙</button>
    </div>

    <div class="controls">
      <div class="field">
        <label for="zikirSelect">Zikir</label>
        <select id="zikirSelect" onchange="changeZikir()">
          <option value="subhanallah">Subhanallah</option>
          <option value="alhamdulillah">Alhamdulillah</option>
          <option value="allahuakbar">Allahu Akbar</option>
          <option value="astaghfirullah">Astaghfirullah</option>
          <option value="lailahaillallah">La ilaha illallah</option>
        </select>
      </div>
      <div class="field">
        <label for="targetInput">Target Custom</label>
        <input id="targetInput" type="number" min="1" inputmode="numeric" placeholder="Contoh 33" onchange="changeTarget()" oninput="liveTarget()" />
      </div>
    </div>

    <div class="circle-wrap">
      <div class="circle-stage">
        <div class="outer-progress" id="progressCircle">
          <button class="main-circle" id="mainCircle" onclick="plusCount()" aria-label="Tambah kiraan tasbih">
            <div class="count" id="count">0</div>
            <div class="target-text">daripada <span id="targetShow">33</span></div>
            <div class="zikir-text" id="zikirShow">Subhanallah</div>
          </button>
        </div>

        <button class="minus-circle" onclick="minusCount()" aria-label="Tolak kiraan tasbih">−</button>
      </div>
    </div>

    <p class="hint">Bulat besar tambah • bulat kecil tolak</p>

    <div class="actions">
      <button class="ghost-btn" onclick="resetCounter()">Reset</button>
      <button class="ghost-btn danger" onclick="clearHistory()">Clear History</button>
    </div>

    <div class="status" id="statusText">Tap bulat besar untuk mula kira zikir.</div>

    <div class="history">
      <h2>History</h2>
      <div class="history-list" id="historyList"></div>
    </div>
  </main>

  <script>
    let count = 0;
    let target = 33;
    let currentZikir = 'subhanallah';
    let currentTheme = 'emerald';
    let hasCompletedCurrentTarget = false;

    const zikirNames = {
      subhanallah: 'Subhanallah',
      alhamdulillah: 'Alhamdulillah',
      allahuakbar: 'Allahu Akbar',
      astaghfirullah: 'Astaghfirullah',
      lailahaillallah: 'La ilaha illallah'
    };

    function toggleTheme() {
      currentTheme = currentTheme === 'emerald' ? 'night' : 'emerald';
      applyTheme();
      saveState();
      setStatus(currentTheme === 'night' ? 'Theme Night diaktifkan.' : 'Theme Hijau diaktifkan.');
    }

    function applyTheme() {
      document.body.className = currentTheme === 'night' ? 'theme-night' : 'theme-emerald';
      document.getElementById('themeBtn').innerText = currentTheme === 'night' ? '☘️' : '🌙';
      updateProgress();
    }

    function changeZikir() {
      currentZikir = document.getElementById('zikirSelect').value;
      document.getElementById('zikirShow').innerText = zikirNames[currentZikir];
      saveState();
      setStatus('Zikir ditukar kepada ' + zikirNames[currentZikir] + '.');
    }

    function liveTarget() {
      const value = Number(document.getElementById('targetInput').value);
      if (value > 0) {
        target = value;
        document.getElementById('targetShow').innerText = target;
        updateProgress();
      }
    }

    function changeTarget() {
      const input = document.getElementById('targetInput');
      const value = Number(input.value);
      target = value > 0 ? value : 33;
      if (!input.value || value <= 0) input.value = target;
      document.getElementById('targetShow').innerText = target;

      if (count < target) {
        hasCompletedCurrentTarget = false;
      } else if (count >= target && !hasCompletedCurrentTarget) {
        completeTarget();
      }

      updateUI();
      setStatus('Target custom ditukar kepada ' + target + '.');
    }

    function plusCount() {
      if (count >= target) {
        setStatus('Target sudah cukup. Tekan Reset untuk mula semula.');
        animateTasbih();
        return;
      }

      count++;
      hasCompletedCurrentTarget = count >= target;
      animateTasbih();
      if (navigator.vibrate) navigator.vibrate(28);
      updateUI();

      if (count >= target) {
        completeTarget();
      } else {
        setStatus('Count sekarang ' + count + '.');
      }
    }

    function minusCount() {
      if (count <= 0) {
        setStatus('Count masih 0.');
        animateTasbih();
        return;
      }

      count--;
      hasCompletedCurrentTarget = false;
      animateTasbih();
      updateUI();
      setStatus('Count ditolak kepada ' + count + '.');
    }

    function animateTasbih() {
      const progress = document.getElementById('progressCircle');
      progress.classList.remove('hit');
      void progress.offsetWidth;
      progress.classList.add('hit');
    }

    function resetCounter() {
      count = 0;
      hasCompletedCurrentTarget = false;
      updateUI();
      setStatus('Count sudah reset.');
    }

    function completeTarget() {
      const history = getHistory();
      const entry = {
        zikir: zikirNames[currentZikir],
        count: target,
        time: new Date().toLocaleString('ms-MY')
      };

      if (!hasCompletedCurrentTarget || count === target) {
        history.unshift(entry);
        localStorage.setItem('tasbihku_history_v2', JSON.stringify(history.slice(0, 12)));
        renderHistory();
      }

      hasCompletedCurrentTarget = true;
      if (navigator.vibrate) navigator.vibrate([110, 60, 110]);
      animateTasbih();
      setStatus('Alhamdulillah, target ' + target + ' selesai.');
      saveState();
    }

    function clearHistory() {
      if (!confirm('Nak padam semua history?')) return;
      localStorage.removeItem('tasbihku_history_v2');
      renderHistory();
      setStatus('History sudah dipadam.');
    }

    function updateUI() {
      document.getElementById('count').innerText = count;
      document.getElementById('targetShow').innerText = target;
      document.getElementById('zikirShow').innerText = zikirNames[currentZikir];
      updateProgress();
      saveState();
    }

    function updateProgress() {
      const pct = Math.min((count / Math.max(target, 1)) * 100, 100);
      const deg = pct * 3.6;
      const accent = getComputedStyle(document.body).getPropertyValue('--accent').trim();
      const empty = getComputedStyle(document.body).getPropertyValue('--progress-empty').trim();
      document.getElementById('progressCircle').style.background = `conic-gradient(${accent} ${deg}deg, ${empty} ${deg}deg)`;
    }

    function setStatus(text) {
      document.getElementById('statusText').innerText = text;
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem('tasbihku_history_v2')) || [];
      } catch(e) {
        return [];
      }
    }

    function renderHistory() {
      const history = getHistory();
      const list = document.getElementById('historyList');
      if (!history.length) {
        list.innerHTML = '<div class="history-item"><span>Belum ada history</span><span>-</span></div>';
        return;
      }
      list.innerHTML = history.map(item => `
        <div class="history-item">
          <span>${item.zikir} × ${item.count}</span>
          <span>${item.time}</span>
        </div>
      `).join('');
    }

    function saveState() {
      localStorage.setItem('tasbihku_state_v2', JSON.stringify({
        count,
        target,
        currentZikir,
        currentTheme,
        hasCompletedCurrentTarget
      }));
    }

    function loadState() {
      try {
        const raw = JSON.parse(localStorage.getItem('tasbihku_state_v2'));
        if (!raw) return;
        count = Number(raw.count) || 0;
        target = Number(raw.target) || 33;
        currentZikir = raw.currentZikir || 'subhanallah';
        currentTheme = raw.currentTheme || 'emerald';
        hasCompletedCurrentTarget = !!raw.hasCompletedCurrentTarget;
      } catch(e) {}
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      document.getElementById('zikirSelect').value = currentZikir;
      document.getElementById('targetInput').value = target;
      applyTheme();
      updateUI();
      renderHistory();
    });
  </script>
</body>
</html>
